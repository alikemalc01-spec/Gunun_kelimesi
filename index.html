<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Günün Kelimesi</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kelime">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#C1272D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --wall:#E4E8E2;--paper:#FCFCFA;--ink:#1D2433;--muted:#626C7B;--red:#C1272D;--rule:#D3D8D0;--soft:#F0F2EE;--onred:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --wall:#14171C;--paper:#1F232A;--ink:#E8EBEE;--muted:#9AA3AE;--red:#E5484D;--rule:#353B44;--soft:#272C34;--onred:#FFFFFF;
  }
}
:root[data-theme="dark"]{
  --wall:#14171C;--paper:#1F232A;--ink:#E8EBEE;--muted:#9AA3AE;--red:#E5484D;--rule:#353B44;--soft:#272C34;--onred:#FFFFFF;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--wall);color:var(--ink);font-family:"Work Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
main{max-width:440px;margin:0 auto;padding:20px 16px 40px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}

.pad{perspective:900px;margin-bottom:22px}
.leaf{
  background:var(--paper);border-radius:6px;overflow:hidden;transform-origin:top center;
  box-shadow:0 3px 0 -1px var(--paper),0 3px 0 0 var(--rule),0 6px 0 -1px var(--paper),0 6px 0 0 var(--rule),0 10px 24px -12px rgba(20,30,40,.35);
}
.leaf-head{background:var(--red);color:var(--onred);display:flex;justify-content:space-between;align-items:center;padding:10px 18px;font-weight:500;font-size:15px}
.leaf-head #streak{font-size:13px;opacity:.92}
.date{text-align:center;padding:14px 18px 0}
.daynum{font-family:"Zilla Slab",Georgia,serif;font-weight:700;font-size:104px;line-height:1;letter-spacing:-.02em}
.daynum.sun{color:var(--red)}
.weekday{color:var(--muted);font-size:15px;margin-top:2px}
.perf{border-top:2px dashed var(--rule);margin:18px 0 0}
.body{padding:20px 22px 22px}
.word-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
#word{font-family:"Zilla Slab",Georgia,serif;font-weight:700;font-size:40px;line-height:1.1;margin:0;overflow-wrap:anywhere}
.speak{flex:none;width:46px;height:46px;border-radius:50%;border:1px solid var(--rule);background:transparent;display:grid;place-items:center}
.speak svg{width:22px;height:22px}
.pos{color:var(--muted);font-size:14px;margin:4px 0 18px;font-style:italic}
.primary{width:100%;padding:13px 16px;border:0;border-radius:10px;background:var(--ink);color:var(--paper);font-weight:600}
.tr{font-family:"Zilla Slab",Georgia,serif;font-weight:500;font-size:24px;margin:0 0 14px}
.ex{margin:0;padding:12px 14px;background:var(--soft);border-left:3px solid var(--red);border-radius:0 8px 8px 0}
.ex p{margin:0}
.ex .en{font-weight:500}
.ex .trs{color:var(--muted);font-size:15px;margin-top:4px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.toggle{padding:11px 10px;border-radius:10px;border:1px solid var(--rule);background:transparent;font-weight:500;font-size:15px}
.toggle[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.daynav{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;margin:0 0 30px}
.daynav button{padding:10px 12px;border-radius:10px;border:1px solid var(--rule);background:var(--paper);font-size:14px;font-weight:500}

section{margin-top:26px}
h2{font-family:"Zilla Slab",Georgia,serif;font-weight:700;font-size:21px;margin:0 0 8px}
ul{list-style:none;margin:0;padding:0;background:var(--paper);border-radius:8px}
li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--rule)}
li:last-child{border-bottom:0}
.li-main{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0}
.li-word{font-weight:600}
.li-tr{color:var(--muted);font-size:14px}
.li-date{flex:none;width:48px;color:var(--muted);font-size:13px}
li.current .li-date{color:var(--red);font-weight:600}
.check{flex:none;color:var(--red);font-size:14px}
.mini{flex:none;border:1px solid var(--rule);background:transparent;border-radius:8px;padding:6px 10px;font-size:13px}
.empty{color:var(--muted);font-size:15px;padding:14px 12px;display:block}
.hint{color:var(--muted);font-size:13px;margin-top:28px;text-align:center}

.leaf.turn-out{animation:out .26s ease-in forwards}
.leaf.turn-in{animation:in .3s ease-out}
@keyframes out{to{transform:translateY(-16px) rotateX(38deg);opacity:0}}
@keyframes in{from{transform:translateY(10px);opacity:0}}
@media (prefers-reduced-motion:reduce){.leaf.turn-out,.leaf.turn-in{animation:none}}
</style>
</head>
<body>
<main>
  <div class="pad">
    <article class="leaf" id="leaf" aria-live="polite">
      <header class="leaf-head"><span id="month"></span><span id="streak"></span></header>
      <div class="date">
        <div class="daynum" id="daynum"></div>
        <div class="weekday" id="weekday"></div>
      </div>
      <div class="perf"></div>
      <div class="body">
        <div class="word-row">
          <h1 id="word"></h1>
          <button class="speak" id="speak" aria-label="Telaffuzu dinle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
          </button>
        </div>
        <p class="pos" id="pos"></p>
        <button class="primary" id="reveal">Anlamını göster</button>
        <div id="answer" hidden>
          <p class="tr" id="tr"></p>
          <div class="ex">
            <p class="en" id="exEn"></p>
            <p class="trs" id="exTr"></p>
          </div>
          <div class="actions">
            <button class="toggle" id="known" aria-pressed="false">Biliyordum</button>
            <button class="toggle" id="review" aria-pressed="false">Tekrar listeme ekle</button>
          </div>
        </div>
      </div>
    </article>
  </div>

  <nav class="daynav" aria-label="Gün seçimi">
    <button id="prev">Önceki gün</button>
    <button id="today">Bugün</button>
    <button id="next">Sonraki gün</button>
  </nav>

  <section>
    <h2>Tekrar listem</h2>
    <ul id="reviewList"></ul>
  </section>

  <section>
    <h2>Son 14 gün</h2>
    <ul id="history"></ul>
  </section>

  <p class="hint">Telefonda uygulama gibi açmak için tarayıcının paylaş menüsünden “Ana Ekrana Ekle”yi seç.</p>
</main>

function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const order=W.map((_,i)=>i);
(()=>{const r=rng(20261007);for(let i=order.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[order[i],order[j]]=[order[j],order[i]]}})();
function dayNum(d){return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5)}
function wordFor(d){const n=dayNum(d);return W[order[((n%W.length)+W.length)%W.length]]}
function dateAt(off){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+off);return d}

function load(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def}catch(e){return def}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

let known=load("gk_known",[]), review=load("gk_review",[]), seen=load("gk_seen",[]);
let offset=0, todayKey=dayNum(new Date());

function markSeen(){
  const t=dayNum(new Date());
  if(!seen.includes(t)){seen.push(t);seen=seen.slice(-400);save("gk_seen",seen)}
  let s=0;while(seen.includes(t-s))s++;
  $("streak").textContent=s>1?s+" gündür üst üste":"";
}

const canSpeak="speechSynthesis" in window;
function speak(text){
  if(!canSpeak)return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=.9;speechSynthesis.speak(u)}catch(e){}
}

function current(){return wordFor(dateAt(offset))}

function render(){
  const d=dateAt(offset), w=wordFor(d);
  $("month").textContent=MONTHS[d.getMonth()]+" "+d.getFullYear();
  $("daynum").textContent=d.getDate();
  $("daynum").classList.toggle("sun",d.getDay()===0);
  $("weekday").textContent=DAYS[d.getDay()];
  $("word").textContent=w[0];
  $("pos").textContent=POS[w[1]]||w[1];
  $("tr").textContent=w[2];
  $("exEn").textContent=w[3];
  $("exTr").textContent=w[4];
  $("answer").hidden=true;$("reveal").hidden=false;
  $("speak").hidden=!canSpeak;
  $("prev").disabled=offset<=-60;$("next").disabled=offset>=0;$("today").disabled=offset===0;
  syncToggles();renderLists();
}

function syncToggles(){
  const w=current()[0];
  const k=known.includes(w), r=review.includes(w);
  $("known").setAttribute("aria-pressed",k);$("known").textContent=k?"Bildiklerimde":"Biliyordum";
  $("review").setAttribute("aria-pressed",r);$("review").textContent=r?"Tekrar listesinde":"Tekrar listeme ekle";
}

function renderLists(){
  const rl=$("reviewList");rl.innerHTML="";
  if(!review.length){rl.innerHTML='<li><span class="empty">Zorlandığın kelimeleri “Tekrar listeme ekle” ile buraya topla.</span></li>'}
  review.slice().reverse().forEach(word=>{
    const w=BY[word];if(!w)return;
    const li=document.createElement("li");
    li.innerHTML='<div class="li-main"><div class="li-word"></div><div class="li-tr"></div></div>';
    li.querySelector(".li-word").textContent=w[0];li.querySelector(".li-tr").textContent=w[2];
    if(canSpeak){const b=document.createElement("button");b.className="mini";b.textContent="Dinle";b.setAttribute("aria-label",w[0]+" kelimesini dinle");b.onclick=()=>speak(w[0]);li.appendChild(b)}
    const x=document.createElement("button");x.className="mini";x.textContent="Kaldır";x.setAttribute("aria-label",w[0]+" kelimesini listeden kaldır");
    x.onclick=()=>{review=review.filter(v=>v!==word);save("gk_review",review);syncToggles();renderLists()};
    li.appendChild(x);rl.appendChild(li);
  });

  const h=$("history");h.innerHTML="";
  for(let i=0;i>-14;i--){
    const d=dateAt(i), w=wordFor(d);
    const li=document.createElement("li");if(i===offset)li.className="current";
    const ds=document.createElement("span");ds.className="li-date";ds.textContent=i===0?"Bugün":d.getDate()+" "+MSHORT[d.getMonth()];
    const b=document.createElement("button");b.className="li-main";
    b.innerHTML='<div class="li-word"></div><div class="li-tr"></div>';
    b.querySelector(".li-word").textContent=w[0];b.querySelector(".li-tr").textContent=w[2];
    b.onclick=()=>{go(i-offset);window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})};
    li.append(ds,b);
    if(known.includes(w[0])){const c=document.createElement("span");c.className="check";c.textContent="✓";c.setAttribute("aria-label","biliniyor");li.appendChild(c)}
    h.appendChild(li);
  }
}

function go(delta){
  if(!delta)return;
  const target=Math.min(0,Math.max(-60,offset+delta));
  if(target===offset)return;
  const leaf=$("leaf");
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){offset=target;render();return}
  leaf.classList.remove("turn-in");leaf.classList.add("turn-out");
  leaf.addEventListener("animationend",function done(){
    leaf.removeEventListener("animationend",done);
    offset=target;render();
    leaf.classList.remove("turn-out");void leaf.offsetWidth;leaf.classList.add("turn-in");
  });
}

$("reveal").onclick=()=>{$("answer").hidden=false;$("reveal").hidden=true};
$("speak").onclick=()=>speak(current()[0]);
$("known").onclick=()=>{
  const w=current()[0];
  if(known.includes(w))known=known.filter(v=>v!==w);else{known.push(w);review=review.filter(v=>v!==w);save("gk_review",review)}
  save("gk_known",known);syncToggles();renderLists();
};
$("review").onclick=()=>{
  const w=current()[0];
  if(review.includes(w))review=review.filter(v=>v!==w);else{review.push(w);known=known.filter(v=>v!==w);save("gk_known",known)}
  save("gk_review",review);syncToggles();renderLists();
};
$("prev").onclick=()=>go(-1);
$("next").onclick=()=>go(1);
$("today").onclick=()=>go(-offset);

document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible"){
    const t=dayNum(new Date());
    if(t!==todayKey){todayKey=t;offset=0;markSeen();render()}
  }
});

markSeen();render();
</script>
</body>
</html>
